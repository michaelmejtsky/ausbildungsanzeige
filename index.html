<!DOCTYPE html>
<html lang="de">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Ausbildungsprogramm
  </title>

  <style>

    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #f4f5f7;

    }

    #frame {

      position: fixed;

      inset: 0;

      width: 100%;
      height: 100%;

      border: 0;

      display: block;

      background: #f4f5f7;

    }

    #loading {

      position: fixed;

      inset: 0;

      z-index: 10;

      display: flex;

      align-items: center;
      justify-content: center;

      background: #34499a;

      color: white;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      font-size: 2vw;
      font-weight: bold;

      transition: opacity 0.4s ease;

    }

    #loading.hidden {

      opacity: 0;
      pointer-events: none;

    }

  </style>

</head>


<body>

  <div id="loading">
    Ausbildungsprogramm wird geladen …
  </div>


  <iframe
    id="frame"
    allowfullscreen
  ></iframe>


  <script>

    /*
     * ======================================================
     * HIER DEINE APPS-SCRIPT /exec ADRESSE EINTRAGEN
     * ======================================================
     */

    const APPS_SCRIPT_URL =
      'https://script.google.com/macros/s/AKfycbyAbgkQBR514pZ1kXxEnNyCpWKHM2opbnV4Y0-MPJjr4eYW6mAWY9H0SSIGUpj0FXukXg/exec';


    /*
     * ======================================================
     * EINSTELLUNGEN
     * ======================================================
     */

    const RELOAD_MINUTES =
      30;


    /*
     * ======================================================
     * INFOSCREEN LADEN
     * ======================================================
     */

    const frame =
      document.getElementById(
        'frame'
      );


    const loading =
      document.getElementById(
        'loading'
      );


    function loadScreen() {

      const separator =
        APPS_SCRIPT_URL.includes('?')
          ? '&'
          : '?';


      /*
       * Zeitstempel verhindert,
       * dass GitHub/Browser eine alte Version cached.
       */

      frame.src =
        APPS_SCRIPT_URL +
        separator +
        't=' +
        Date.now();

    }


    frame.addEventListener(
      'load',
      function () {

        setTimeout(
          function () {

            loading.classList.add(
              'hidden'
            );

          },
          400
        );

      }
    );


    /*
     * ======================================================
     * REGELMÄSSIG KOMPLETT NEU LADEN
     * ======================================================
     */

    setInterval(
      function () {

        loadScreen();

      },
      RELOAD_MINUTES *
      60 *
      1000
    );


    /*
     * ======================================================
     * START
     * ======================================================
     */

    loadScreen();

  </script>

</body>

</html>
